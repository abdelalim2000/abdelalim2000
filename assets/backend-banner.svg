<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="315" viewBox="0 0 1200 315" role="img" aria-labelledby="title desc">
  <title id="title">Mohamed A. Abdelalim — Backend Engineer</title>
  <desc id="desc">Dark navy banner featuring Mohamed's name, backend engineering specialization, and an animated system diagram.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0a1220"/>
      <stop offset="100%" stop-color="#101f2c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0%" stop-color="#54e6c3"/>
      <stop offset="100%" stop-color="#5baaf8"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M 26 0 L 0 0 0 26" fill="none" stroke="#6a90ab" stroke-opacity=".075" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="315" rx="22" fill="url(#background)"/>
  <rect width="1200" height="315" rx="22" fill="url(#grid)"/>
  <rect x="30" y="28" width="4" height="259" rx="2" fill="url(#accent)"/>
  <text x="66" y="73" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="3" fill="#60e4ce">BACKEND ENGINEERING</text>
  <text x="66" y="148" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="750" fill="#f2f8ff">Mohamed A. Abdelalim</text>
  <text x="68" y="191" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="500" fill="#b4c7d6">PHP / Laravel  ·  APIs  ·  AI Integrations</text>
  <path d="M68 219 H690" stroke="#294254" stroke-width="1"/>
  <text x="68" y="256" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#8daabd">Building reliable software, one thoughtful decision at a time.</text>
  <g transform="translate(753 25)">
    <rect x="5" y="7" width="426" height="267" rx="18" fill="#102637" fill-opacity=".58" stroke="#46627c" stroke-opacity=".35"/>
    <path d="M63 116 C118 116 126 66 185 66 S254 117 313 117" stroke="#3f7280" stroke-width="3" fill="none"/>
    <path d="M63 116 C118 116 122 195 185 195 S255 161 313 161" stroke="#3f7280" stroke-width="3" fill="none"/>
    <path d="M185 66 V195" stroke="#3f7280" stroke-width="3" stroke-dasharray="5 8"/>
    <rect x="24" y="87" width="91" height="58" rx="12" fill="#193848" stroke="#59ddc4" stroke-opacity=".8"/>
    <text x="69.5" y="123" fill="#ccfff0" font-family="Consolas, monospace" font-size="19" font-weight="bold" text-anchor="middle">API</text>
    <rect x="146" y="35" width="92" height="60" rx="12" fill="#193848" stroke="#60b8f6" stroke-opacity=".75"/>
    <text x="192" y="71" fill="#d5ebff" font-family="Consolas, monospace" font-size="18" font-weight="bold" text-anchor="middle">DATA</text>
    <rect x="146" y="166" width="92" height="60" rx="12" fill="#193848" stroke="#60b8f6" stroke-opacity=".75"/>
    <text x="192" y="202" fill="#d5ebff" font-family="Consolas, monospace" font-size="18" font-weight="bold" text-anchor="middle">JOBS</text>
    <rect x="286" y="107" width="112" height="66" rx="12" fill="#193848" stroke="#59ddc4" stroke-opacity=".85"/>
    <text x="342" y="145" fill="#ccfff0" font-family="Consolas, monospace" font-size="18" font-weight="bold" text-anchor="middle">OUTPUT</text>
    <circle r="5" fill="#72ffdb" filter="url(#glow)">
      <animateMotion path="M95 116 C140 116 141 66 185 66 S251 117 313 117" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="5" fill="#7bbffb" filter="url(#glow)">
      <animateMotion path="M95 116 C140 116 141 195 185 195 S251 161 313 161" dur="5.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="342" cy="140" r="44" stroke="#52dac1" fill="none" stroke-width="1.5" opacity=".12">
      <animate attributeName="r" values="39;55;39" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".22;.02;.22" dur="4s" repeatCount="indefinite"/>
    </circle>
    <text x="216" y="251" text-anchor="middle" font-family="Consolas, monospace" font-size="12" letter-spacing="2" fill="#6f9baa">DESIGN  ·  SHIP  ·  IMPROVE</text>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="313.5" rx="21" fill="none" stroke="#35526a" stroke-opacity=".6" stroke-width="1.5"/>
</svg>